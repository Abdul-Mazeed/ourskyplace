<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SafeSky — Private Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {font-family: 'Inter', system-ui, Arial; background: linear-gradient(135deg, #f0f4f8, #e8edf2, #d6e0f0); padding: 20px; max-width: 500px; margin: auto;}
h2 {text-align: center; color: #2c3e50; text-shadow: 1px 1px 3px #aaa; margin-bottom: 20px;}
#chat {background:#fff;border:2px solid #cbd5e1;height:400px;overflow-y:auto;padding:15px;border-radius:20px;margin-bottom:10px;box-shadow:0 10px 20px rgba(0,0,0,0.05); display:flex; flex-direction:column;}
.msg {margin:8px 0;padding:12px 18px;border-radius:18px;max-width:75%; position:relative; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.08); font-size:15px;}
.msg.mine {background: linear-gradient(135deg, #4b79a1, #283e51); color:#fff; align-self:flex-end; margin-left:auto;}
.msg.theirs {background: linear-gradient(135deg, #e0eafc, #c0d9f8); color:#000; align-self:flex-start; margin-right:auto;}
.msg:hover {transform: scale(1.02);}
input, button {padding:12px;border-radius:12px;border:1px solid #ccc;width:100%;box-sizing:border-box; margin-top:6px; font-size:14px;}
button {background:#4b79a1;color:#fff;border:none;cursor:pointer;font-weight:600;transition:0.2s;}
button:hover {background:#283e51;}
.options {display:flex; gap:8px; margin-top:6px;}
.option-btn {flex:1; padding:10px; border-radius:12px; border:none; cursor:pointer; transition:0.2s; font-weight:600; font-size:16px;}
.option-btn:hover {opacity:0.85;}
.option-heart {background:#ff6b6b; color:#fff;}
.option-smile {background:#ffd93d; color:#333;}
.option-star {background:#4db6ff; color:#fff;}
.heart {position: absolute; font-size:24px; animation: floatUp 2s ease-out forwards;}
@keyframes floatUp {0% {opacity:1; transform: translateY(0) scale(1);} 100% {opacity:0; transform: translateY(-100px) scale(1.5);}}
</style>
</head>
<body>
<h2>SafeSky — Private Notes</h2>
<div id="chat"></div>
<input id="text" placeholder="Type your message..." />
<div class="options">
  <button class="option-btn option-heart" onclick="sendOption('❤️')">Heart</button>
  <button class="option-btn option-smile" onclick="sendOption('😊')">Smile</button>
  <button class="option-btn option-star" onclick="sendOption('⭐')">Star</button>
</div>
<button id="send">Send</button>
<script>
function load(){
  const c=document.getElementById('chat'); c.innerHTML='';
  (JSON.parse(localStorage.getItem('ss_chat')||'[]')).forEach(m=>{
    const d=document.createElement('div');
    d.className='msg '+m.type;
    d.textContent=m.text;
    c.appendChild(d);
    c.scrollTop=c.scrollHeight;
  });
}
load();

document.getElementById('send').onclick=()=>{
  const t=document.getElementById('text');
  if(!t.value.trim()) return;
  let arr=JSON.parse(localStorage.getItem('ss_chat')||'[]');
  arr.push({text:t.value.trim(), type:'mine'});
  localStorage.setItem('ss_chat', JSON.stringify(arr));
  t.value=''; load();
  showHeart();
};

function sendOption(icon){
  let arr=JSON.parse(localStorage.getItem('ss_chat')||'[]');
  arr.push({text:icon, type:'mine'});
  localStorage.setItem('ss_chat', JSON.stringify(arr));
  load();
  showHeart();
}

function showHeart(){
  const chat=document.getElementById('chat');
  const heart=document.createElement('div');
  heart.className='heart';
  heart.textContent='❤️';
  heart.style.left=Math.random()*80+'%';
  chat.appendChild(heart);
  setTimeout(()=>chat.removeChild(heart),2000);
}

setInterval(()=>{
  load();
},2000);
</script>
</body>
</html>
